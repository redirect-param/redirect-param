<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Julius Mwangi - Full-Stack Developer, AI Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05080d"/><stop offset="1" stop-color="#0d1a14"/></linearGradient>
<linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22c55e"/><stop offset="0.5" stop-color="#e2e8f0"/><stop offset="1" stop-color="#ef4444"/>
<animate attributeName="x1" values="0;0.4;0" dur="8s" repeatCount="indefinite"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#22c55e" stroke-opacity="0.07"/></pattern>
<radialGradient id="glow"><stop offset="0" stop-color="#22c55e" stop-opacity="0.35"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
<style>
.name{font:800 78px 'Segoe UI',Helvetica,Arial,sans-serif;fill:url(#name);letter-spacing:-2px}
.role{font:600 30px 'SFMono-Regular',Consolas,'Courier New',monospace;fill:#4ade80}
.cur{fill:#ef4444;animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
.tag{font:400 19px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#94a3b8}
</style></defs>
<rect width="1200" height="320" rx="18" fill="url(#bg)"/>
<rect width="1200" height="320" rx="18" fill="url(#grid)"/>
<circle cx="1020" cy="80" r="220" fill="url(#glow)"><animate attributeName="r" values="200;240;200" dur="6s" repeatCount="indefinite"/></circle>
<g fill="none" stroke-width="2" stroke-linecap="round" opacity="0.8">
<path d="M880 230 l-40 30 40 30" stroke="#22c55e"/><path d="M1000 230 l40 30 -40 30" stroke="#22c55e"/>
<path d="M955 222 l-20 76" stroke="#ef4444"><animate attributeName="stroke-opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/></path></g>
<text x="60" y="140" class="name">Julius Mwangi</text>
<text x="60" y="215" class="role" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;1;1;0;0" keyTimes="0;0.001;0.020;0.230;0.250;1"/>&gt; Full-Stack Developer<tspan class="cur">_</tspan></text>
<text x="60" y="215" class="role" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.249;0.270;0.480;0.500;1"/>&gt; AI Engineer<tspan class="cur">_</tspan></text>
<text x="60" y="215" class="role" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.499;0.520;0.730;0.750;1"/>&gt; Automation Builder<tspan class="cur">_</tspan></text>
<text x="60" y="215" class="role" opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.749;0.770;0.980;1.000;1"/>&gt; Linux User<tspan class="cur">_</tspan></text>

<text x="60" y="270" class="tag">I don't just write code. I build systems that solve problems.</text>
<rect x="0" y="312" width="400" height="8" fill="#000"/><rect x="400" y="312" width="400" height="8" fill="#dc2626"/><rect x="800" y="312" width="400" height="8" fill="#16a34a"/>
</svg>
